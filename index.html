<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absenteeism Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>

<section id="login">
  <div class="login-card">
    <div class="logo">A%</div>
    <h1>Absenteeism Dashboard</h1>
    <input id="usr" placeholder="Username" autocomplete="username">
    <input id="pwd" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn b-up" id="loginBtn">Sign in</button>
  </div>
</section>

<main id="app" hidden>
  <header>
    <div class="brand"><span class="logo sm">A%</span><h2>Absenteeism Dashboard</h2></div>
    <nav id="tabs"></nav>
    <div class="me"><span id="who"></span><button class="btn sm b-del" id="logout">Logout</button></div>
  </header>

  <section id="v-dash">
    <div class="card slim">
      <div class="row c">
        <button class="btn b-up big" id="upSch">Upload Schedule</button>
        <button class="btn sm b-ref" id="gear" hidden>⚙ Settings</button>
      </div>
      <div id="settings" hidden>
        <div class="row c" style="margin-top:16px">
          <label>Header rows <input id="hdr" type="number" value="20" min="0"></label>
          <label>Duration column <input id="dcol" value="J" maxlength="2"></label>
          <label>Status <select id="stf"><option value="all">All</option><option value="Active">Active only</option></select></label>
        </div>
        <p id="info" class="muted c">Upload the schedule file to see the processing details here.</p>
      </div>
    </div>

    <div class="card slim" id="pivotCard">
      <div class="bar"><h3>Absenteeism %</h3><button class="btn sm b-exp" id="copyDash">Copy Dash</button></div>
      <div class="wrap" dir="ltr" id="pivot"></div>
    </div>

    <div class="card">
      <div class="bar">
        <h3>Final Codes <small id="cnt" class="muted"></small></h3>
        <div class="row">
          <label id="tlLbl">Leader <select id="tlf"><option value="all">All Leaders</option></select></label>
          <button class="btn sm b-exp" id="expView">Export Absent Codes </button>
          <button class="btn sm b-save" id="expAll">Export All Codes </button>
        </div>
      </div>
      <div class="wrap" dir="ltr" id="final"></div>
    </div>
  </section>

  <section id="v-ed" hidden></section>
  <footer>© Seif 2026</footer>
</main>

<div id="busy" hidden><div class="spin"></div></div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
